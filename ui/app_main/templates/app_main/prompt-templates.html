{% extends "app_main/base.html" %}

{% block meta %}
<title>Diixo - Templates</title>
<meta property="og:title" content="Diixo - Templates">
<meta name="description" content="Diixo templates">
<meta property="og:description" content="Diixo templates">
{% endblock %}

{% block content %}

<h3 class="fw-bold mt-4">Prompt Templates</h3>
<p class="text-muted">{{ goal }}</p>

<button type="button" class="btn btn-main d-inline-flex align-items-center align-self-start mb-2"
  data-bs-toggle="modal" data-bs-target="#addTemplateModal">
  <span class="material-icons me-1">add</span> Add prompt style
</button>

<div class="row g-3 mt-1 mb-4">
  {% for t in templates %}
  <div class="col-12 col-lg-8">
    <div class="card h-100 shadow-sm border-0">
      <div class="card-body">
        <div class="d-flex align-items-center gap-2 mb-2">
          <span class="material-icons text-primary">code</span>
          <h6 class="card-title mb-0 fw-bold">{{ t.name }} format style</h6>
        </div>
        <pre class="bg-body-tertiary border rounded p-3 small mb-3">{{ t.template }}</pre>
        <p class="card-text small text-body-secondary mb-2">{{ t.description }}</p>
      </div>
    </div>
  </div>
  {% endfor %}
</div>

<div class="modal fade" id="addTemplateModal" tabindex="-1" aria-labelledby="addTemplateModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form method="post">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title" id="addTemplateModalLabel">Add prompt style</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="tplName" class="form-label">Name</label>
            <input type="text" class="form-control" id="tplName" name="name" required>
          </div>
          <div class="mb-3">
            <label for="tplDescription" class="form-label">Description</label>
            <input type="text" class="form-control" id="tplDescription" name="description">
          </div>
          <div class="mb-3">
            <label for="tplTemplate" class="form-label">Template</label>
            <textarea class="form-control font-monospace" id="tplTemplate" name="template" rows="8"
              placeholder="Use {instruction} and {document} placeholders" required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
