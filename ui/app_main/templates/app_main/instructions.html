{% extends "app_main/base.html" %}

{% block meta %}
<title>Diixo - Instructions</title>
<meta property="og:title" content="Diixo - Instructions">
<meta name="description" content="Diixo instructions">
<meta property="og:description" content="Diixo instructions">
{% endblock %}

{% block content %}

<h3 class="fw-bold mt-4">Instructions</h3>
<p class="text-muted">{{ goal }}</p>

<h5 class="fw-semibold mt-4 mb-3">Document analysis instructions</h5>
<div class="row g-3">
  {% for task in tasks %}
  <div class="col-md-6 col-lg-3">
    <div class="card h-100 shadow-sm border-0">
      <div class="card-body">
        <div class="d-flex align-items-center gap-2 mb-2">
          <span class="material-icons text-primary">{{ task.icon }}</span>
          <h6 class="card-title mb-0 fw-bold">{{ task.title }}</h6>
        </div>
        <p class="card-text small text-body-secondary mb-2">{{ task.description }}</p>
        <code class="small d-block text-wrap">{{ task.instruction }}</code>
      </div>
    </div>
  </div>
  {% endfor %}
</div>

{% endblock %}
